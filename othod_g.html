<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Классификатор медицинских отходов</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background-color: #f5f7f9;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 20px;
  min-height: 100vh;
}

.widget-container {
  width: 100%;
  max-width: 550px;
  background-color: #eef7eb;
  border: 1px solid #bad8b4;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 8px 32px rgba(43, 136, 109, 0.04);
}

.widget-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

.widget-logo {
  height: 36px;
  width: auto;
  object-fit: contain;
}

.widget-title {
  font-size: 20px;
  font-weight: 700;
  color: #1a3b11;
  text-align: left;
}

.tabs {
  display: flex;
  background: #ffffff;
  border: 1px solid #c2dbbc;
  border-radius: 30px;
  padding: 4px;
  margin-bottom: 24px;
}

.tab-btn {
  flex: 1;
  padding: 10px 16px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  color: #4a7c3f;
  cursor: pointer;
  border-radius: 30px;
  transition: all 0.2s ease;
}

.tab-btn.active {
  background-color: #2b886d;
  color: #ffffff;
}

.input-label {
  display: block;
  font-size: 12px;
  color: #556860;
  margin-bottom: 8px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.search-container {
  position: relative;
  margin-bottom: 16px;
  width: 100%;
}

.search-input, .custom-select {
  width: 100%;
  padding: 12px 48px 12px 16px;
  background: #ffffff;
  border: 1px solid #cbdcd5;
  border-radius: 12px;
  font-family: inherit;
  font-size: 15px;
  color: #24332e;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.search-input:focus, .custom-select:focus {
  border-color: #2b886d;
  box-shadow: 0 0 0 3px rgba(43, 136, 109, 0.12);
}

.custom-select {
  appearance: none;
  cursor: pointer;
  background-image: url("data:image/svg+xml;utf8,<svg fill='%234a7c3f' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
  background-repeat: no-repeat;
  background-position: right 16px center;
  background-size: 20px;
}

.controls-icons {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  color: #93ab9e;
}

.clear-btn {
  cursor: pointer;
  font-size: 20px;
  font-weight: bold;
  line-height: 1;
  color: #93ab9e;
  padding: 0 4px;
  transition: color 0.2s ease;
}

.clear-btn:hover {
  color: #b91c1c;
}

.dropdown-arrow {
  font-size: 10px;
  color: #93ab9e;
  pointer-events: none;
}

.dropdown-list {
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #ffffff;
  border: 1px solid #cbdcd5;
  border-radius: 12px;
  max-height: 250px;
  overflow-y: auto;
  z-index: 1000;
  display: none;
  box-shadow: 0 8px 24px rgba(43, 136, 109, 0.08);
  margin-top: 6px;
}

.dropdown-list.visible {
  display: block;
}

.dropdown-item {
  padding: 12px 16px;
  cursor: pointer;
  font-size: 14px;
  color: #24332e;
  border-bottom: 1px solid #f0f4f2;
  transition: background-color 0.15s ease, color 0.15s ease;
}

.dropdown-item:last-child {
  border-bottom: none;
}

.dropdown-item:hover, .dropdown-item.selected {
  background-color: #2b886d;
  color: #ffffff;
}

.result-card {
  background: #ffffff;
  border: 1px solid #cbdcd5;
  border-radius: 16px;
  padding: 20px;
  margin-top: 16px;
  display: none;
  box-shadow: 0 4px 15px rgba(43, 136, 109, 0.02);
  animation: fadeIn 0.25s ease-out;
}

.result-card.visible {
  display: block;
}

.result-content-row {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.result-badge {
  width: 54px;
  height: 54px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  flex-shrink: 0;
  border: 1px solid transparent;
}

/* Badge Hazard Color Schemes */
.badge-1 {
  background-color: #fef2f2;
  color: #b91c1c;
  border-color: #fca5a5;
}

.badge-2 {
  background-color: #fff7ed;
  color: #c2410c;
  border-color: #fed7aa;
}

.badge-3 {
  background-color: #fefce8;
  color: #854d0e;
  border-color: #fef08a;
}

.badge-4 {
  background-color: #f0fdf4;
  color: #2b886d;
  border-color: #bbf7d0;
}

.result-info-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.result-class-title {
  font-size: 18px;
  font-weight: 700;
  color: #24332e;
}

.result-class-desc {
  font-size: 14px;
  color: #647d75;
}

.result-code-row {
  border-top: 1px solid #e7f1ed;
  padding-top: 12px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.result-code-label {
  font-size: 11px;
  font-weight: 700;
  color: #93ab9e;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.result-code-value {
  font-family: 'Courier New', Courier, monospace;
  font-size: 16px;
  font-weight: 700;
  color: #4a5c56;
  letter-spacing: 0.03em;
}

/* Waste list by class (tab 2) */
.waste-list {
  list-style: none;
  padding: 0;
  margin-top: 12px;
  max-height: 240px;
  overflow-y: auto;
}

.waste-list::-webkit-scrollbar {
  width: 6px;
}

.waste-list::-webkit-scrollbar-track {
  background: #f1f6f4;
  border-radius: 4px;
}

.waste-list::-webkit-scrollbar-thumb {
  background: #cbdcd5;
  border-radius: 4px;
}

.waste-list::-webkit-scrollbar-thumb:hover {
  background: #93ab9e;
}

.waste-list li {
  padding: 10px 0;
  font-size: 14px;
  color: #24332e;
  border-bottom: 1px solid #e7f1ed;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.waste-list li:last-child {
  border-bottom: none;
}

.waste-li-name {
  font-weight: 500;
  padding-right: 12px;
  line-height: 1.4;
}

.waste-li-code {
  font-family: 'Courier New', Courier, monospace;
  font-size: 12px;
  color: #647d75;
  background: #f1f6f4;
  padding: 2px 8px;
  border-radius: 6px;
  white-space: nowrap;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

</style>
</head>

document.addEventListener('DOMContentLoaded', () => {
  // DOM Elements
  const tabWaste = document.getElementById('tab-waste');
  const tabClasses = document.getElementById('tab-classes');
  const contentWaste = document.getElementById('content-waste');
  const contentClasses = document.getElementById('content-classes');
  
  const wasteSearch = document.getElementById('waste-search');
  const wasteDropdown = document.getElementById('waste-dropdown');
  const wasteClear = document.getElementById('waste-clear');
  const wasteResult = document.getElementById('waste-result');
  
  const wasteResultBadge = document.getElementById('waste-result-badge');
  const wasteResultClassTitle = document.getElementById('waste-result-class-title');
  const wasteResultClassDesc = document.getElementById('waste-result-class-desc');
  const wasteResultCodeValue = document.getElementById('waste-result-code-value');
  
  const classSelect = document.getElementById('class-select');
  const classResult = document.getElementById('class-result');
  const classResultTitle = document.getElementById('class-result-title');
  const classResultList = document.getElementById('class-result-list');
  const widgetLogo = document.getElementById('widget-logo');

  // Hazard Class descriptors mapping
  const classInfo = {
    '1': { title: 'I класс', desc: 'чрезвычайно опасные', roman: 'I' },
    '2': { title: 'II класс', desc: 'высокоопасные', roman: 'II' },
    '3': { title: 'III класс', desc: 'умеренно опасные', roman: 'III' },
    '4': { title: 'IV класс', desc: 'малоопасные', roman: 'IV' }
  };

  // State Variables
  let allWastes = [];

  // Initialize and check data
  function init() {
    if (typeof wasteData === 'undefined') {
      console.error("wasteData is not loaded");
      return;
    }

    // Use base64 logo if bundled
    if (typeof logoBase64 !== 'undefined' && logoBase64 && widgetLogo) {
      widgetLogo.src = logoBase64;
    }

    // Sort wastes alphabetically
    allWastes = [...wasteData].sort((a, b) => a.name.localeCompare(b.name));

    // Tab Listeners
    tabWaste.addEventListener('click', () => switchTab('waste'));
    tabClasses.addEventListener('click', () => switchTab('classes'));

    // Waste Dropdown Event Listeners
    wasteSearch.addEventListener('input', handleSearchInput);
    wasteSearch.addEventListener('click', handleSearchClick);
    wasteClear.addEventListener('click', handleSearchClear);
    
    // Keyboard navigation inside dropdown
    wasteSearch.addEventListener('keydown', handleSearchKeydown);

    // Class selection listener
    classSelect.addEventListener('change', handleClassChange);

    // Click outside to close dropdown
    document.addEventListener('click', (e) => {
      if (!wasteSearch.contains(e.target) && !wasteDropdown.contains(e.target)) {
        closeDropdown();
      }
    });
  }

  // --- Tab Logic ---
  function switchTab(tab) {
    if (tab === 'waste') {
      tabWaste.classList.add('active');
      tabClasses.classList.remove('active');
      contentWaste.style.display = 'block';
      contentClasses.style.display = 'none';
    } else {
      tabClasses.classList.add('active');
      tabWaste.classList.remove('active');
      contentClasses.style.display = 'block';
      contentWaste.style.display = 'none';
    }
  }

  // --- Dropdown Logic ---
  let focusedIndex = -1;

  function renderDropdown(query = '') {
    wasteDropdown.innerHTML = '';
    focusedIndex = -1;
    const q = query.trim().toLowerCase();
    
    // Filter items based on query
    const filtered = q 
      ? allWastes.filter(item => item.name.toLowerCase().includes(q)) 
      : allWastes;

    if (filtered.length > 0) {
      filtered.forEach((item, index) => {
        const div = document.createElement('div');
        div.className = 'dropdown-item';
        div.textContent = item.name;
        div.dataset.index = index;
        
        div.addEventListener('click', (e) => {
          e.stopPropagation();
          selectWaste(item);
        });

        wasteDropdown.appendChild(div);
      });
      wasteDropdown.classList.add('visible');
    } else {
      closeDropdown();
    }
  }

  function selectWaste(item) {
    wasteSearch.value = item.name;
    closeDropdown();
    wasteClear.style.display = 'inline';
    
    // Display result card
    const info = classInfo[item.class] || { title: `${item.class} класс`, desc: '', roman: item.class };
    
    // Update badge class and text
    wasteResultBadge.textContent = info.roman;
    wasteResultBadge.className = `result-badge badge-${item.class}`;
    
    // Update labels
    wasteResultClassTitle.textContent = info.title;
    wasteResultClassDesc.textContent = info.desc;
    wasteResultCodeValue.textContent = item.fkko || '—';
    
    // Make card visible
    wasteResult.classList.add('visible');
  }

  function handleSearchInput() {
    const val = wasteSearch.value;
    wasteClear.style.display = val ? 'inline' : 'none';
    renderDropdown(val);
    if (!val) {
      wasteResult.classList.remove('visible');
    }
  }

  function handleSearchClick(e) {
    e.stopPropagation();
    renderDropdown(wasteSearch.value);
  }

  function handleSearchClear(e) {
    e.stopPropagation();
    wasteSearch.value = '';
    wasteClear.style.display = 'none';
    closeDropdown();
    wasteResult.classList.remove('visible');
    wasteSearch.focus();
  }

  function closeDropdown() {
    wasteDropdown.classList.remove('visible');
  }

  function handleSearchKeydown(e) {
    const items = wasteDropdown.querySelectorAll('.dropdown-item');
    if (!wasteDropdown.classList.contains('visible') || items.length === 0) {
      if (e.key === 'ArrowDown') {
        renderDropdown(wasteSearch.value);
      }
      return;
    }

    if (e.key === 'ArrowDown') {
      e.preventDefault();
      focusedIndex = (focusedIndex + 1) % items.length;
      updateFocusedItem(items);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      focusedIndex = (focusedIndex - 1 + items.length) % items.length;
      updateFocusedItem(items);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (focusedIndex >= 0 && focusedIndex < items.length) {
        items[focusedIndex].click();
      }
    } else if (e.key === 'Escape') {
      closeDropdown();
    }
  }

  function updateFocusedItem(items) {
    items.forEach((item, index) => {
      if (index === focusedIndex) {
        item.classList.add('selected');
        // Scroll item into view inside dropdown
        item.scrollIntoView({ block: 'nearest' });
      } else {
        item.classList.remove('selected');
      }
    });
  }

  // --- Class Tab Logic ---
  function handleClassChange(e) {
    const selectedCls = e.target.value;
    if (!selectedCls) {
      classResult.classList.remove('visible');
      return;
    }

    // Filter waste items by class
    const filteredWastes = [...wasteData]
      .filter(item => item.class === selectedCls)
      .sort((a, b) => a.name.localeCompare(b.name));

    const info = classInfo[selectedCls] || { title: `${selectedCls} класс` };
    classResultTitle.textContent = `Отходы ${info.title.toLowerCase()} — ${info.desc}`;

    // Populate List
    classResultList.innerHTML = '';
    filteredWastes.forEach(item => {
      const li = document.createElement('li');
      
      const nameSpan = document.createElement('span');
      nameSpan.className = 'waste-li-name';
      nameSpan.textContent = item.name;

      const codeSpan = document.createElement('span');
      codeSpan.className = 'waste-li-code';
      codeSpan.textContent = item.fkko || '—';

      li.appendChild(nameSpan);
      li.appendChild(codeSpan);
      classResultList.appendChild(li);
    });

    classResult.classList.add('visible');
  }

  // Start widget
  init();
});


</script>
</body>
</html>
