<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Справочник допусков — а360</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f5f7f9;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 20px;
      min-height: 100vh;
      color: #24332e;
    }

    .widget-container {
      width: 100%;
      max-width: 760px;
      background-color: #eef7eb;
      border: 1px solid #bad8b4;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(43, 136, 109, 0.05);
      position: relative;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(43, 136, 109, 0.1);
      padding-bottom: 16px;
    }

    .logo-title-container {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .widget-logo {
      height: 42px;
      width: auto;
      object-fit: contain;
    }

    .header-text-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .widget-title {
      font-size: 20px;
      font-weight: 700;
      color: #1a3b11;
    }

    .widget-subtitle {
      font-size: 13px;
      font-weight: 500;
      color: #556860;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .header-print-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: transparent;
      border: 1px solid #bad8b4;
      color: #2b886d;
      padding: 8px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .header-print-btn:hover {
      background-color: #2b886d;
      color: #ffffff;
      border-color: #2b886d;
    }

    .header-print-btn svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    /* Tabs Selector */
    .tabs-container {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
      border-bottom: 1px solid #cbdcd5;
    }

    .tab-btn {
      padding: 8px 6px;
      border: 1px solid #cbdcd5;
      border-bottom: none;
      background: #f5f8f6;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      color: #556860;
      cursor: pointer;
      border-radius: 8px 8px 0 0;
      transition: all 0.2s ease;
      white-space: nowrap;
      margin-bottom: -1px;
      flex: 1;
      text-align: center;
    }

    .tab-btn:hover {
      border-color: #2b886d;
      color: #2b886d;
      background-color: #ffffff;
    }

    .tab-btn.active {
      background-color: #ffffff;
      color: #2b886d;
      border-color: #cbdcd5 #cbdcd5 #ffffff #cbdcd5;
      border-top: 3px solid #2b886d;
      height: calc(100% + 1px);
      padding-top: 8px;
    }

    .search-section {
      margin-bottom: 24px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      color: #556860;
      margin-bottom: 8px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .search-container {
      position: relative;
      width: 100%;
    }

    .search-input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: #ffffff;
      border: 1px solid #cbdcd5;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      color: #24332e;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
    }

    .search-input:focus {
      border-color: #2b886d;
      box-shadow: 0 0 0 3px rgba(43, 136, 109, 0.12);
    }

    .controls-icons {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      color: #93ab9e;
    }

    .clear-btn {
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      line-height: 1;
      color: #93ab9e;
      padding: 0 4px;
      transition: color 0.2s ease;
      display: none;
    }

    .clear-btn:hover {
      color: #b91c1c;
    }

    .dropdown-arrow {
      font-size: 10px;
      color: #93ab9e;
      pointer-events: none;
      transition: transform 0.2s ease;
    }

    .dropdown-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1px solid #cbdcd5;
      border-radius: 12px;
      max-height: 280px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 10px 30px rgba(43, 136, 109, 0.08);
      margin-top: 6px;
    }

    .dropdown-list.visible {
      display: block;
    }

    .dropdown-item {
      padding: 12px 16px;
      cursor: pointer;
      font-size: 14px;
      color: #24332e;
      border-bottom: 1px solid #f0f4f2;
      transition: background-color 0.15s ease, color 0.15s ease;
      line-height: 1.4;
    }

    .dropdown-item-group {
      display: block;
      font-size: 11px;
      color: #8da397;
      margin-top: 2px;
      font-weight: 500;
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover, .dropdown-item.selected {
      background-color: #2b886d;
      color: #ffffff;
    }

    .dropdown-item:hover .dropdown-item-group, .dropdown-item.selected .dropdown-item-group {
      color: rgba(255, 255, 255, 0.7);
    }

    .result-card {
      background: #ffffff;
      border: 1px solid #cbdcd5;
      border-radius: 16px;
      padding: 24px;
      display: none;
      box-shadow: 0 4px 15px rgba(43, 136, 109, 0.02);
      animation: fadeIn 0.3s ease-out;
    }

    .result-card.visible {
      display: block;
    }

    .card-title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid #e7f1ed;
      padding-bottom: 16px;
    }

    .card-title-text {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title-label {
      font-size: 11px;
      font-weight: 700;
      color: #8da397;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #1c2e27;
      line-height: 1.3;
    }

    .code-badge {
      background-color: #eef7eb;
      color: #2b886d;
      border: 1px solid #bad8b4;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      margin-top: 4px;
    }

    .requirements-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .requirement-block {
      padding: 16px;
      background: #fcfdfb;
      border: 1px solid #e2ece8;
      border-left: 4px solid #2b886d;
      border-radius: 8px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .requirement-block:hover {
      transform: translateX(4px);
      box-shadow: 0 4px 12px rgba(43, 136, 109, 0.03);
    }

    .block-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .block-icon {
      width: 18px;
      height: 18px;
      color: #2b886d;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .block-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .block-label {
      font-size: 11px;
      font-weight: 700;
      color: #556860;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .block-value {
      font-size: 14px;
      line-height: 1.5;
      color: #24332e;
    }

    .block-value a {
      color: #2b886d;
      text-decoration: underline;
      font-weight: 600;
      transition: color 0.15s ease;
    }

    .block-value a:hover {
      color: #1d5f4b;
    }

    .source-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      text-decoration: none !important;
      background: #eef7eb;
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 6px;
      border: 1px dashed #bad8b4;
    }

    .source-link:hover {
      background: #cbdcd5 !important;
      border-color: #cbdcd5 !important;
    }

    .print-btn-container {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .print-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background-color: #2b886d;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    .print-btn:hover {
      background-color: #1d5f4b;
    }

    .print-btn:active {
      transform: scale(0.98);
    }

    .print-btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
    }

    /* Scrollbars */
    .dropdown-list::-webkit-scrollbar {
      width: 6px;
    }
    .dropdown-list::-webkit-scrollbar-track {
      background: #f1f6f4;
      border-radius: 4px;
    }
    .dropdown-list::-webkit-scrollbar-thumb {
      background: #cbdcd5;
      border-radius: 4px;
    }
    .dropdown-list::-webkit-scrollbar-thumb:hover {
      background: #93ab9e;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .tabs-container {
        flex-wrap: wrap;
        border-bottom: none;
        gap: 6px;
      }
      .tab-btn {
        border-radius: 8px;
        border-bottom: 1px solid #cbdcd5;
        margin-bottom: 4px;
        flex: 1 1 45%;
        padding: 8px 4px;
      }
      .tab-btn.active {
        border-bottom: 1px solid #cbdcd5;
        border-top: 3px solid #2b886d;
        height: auto;
        padding-top: 8px;
      }
    }

    /* Print Styles */
    @media print {
      body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .widget-container {
        border: none !important;
        box-shadow: none !important;
        background: #ffffff !important;
        padding: 0 !important;
        max-width: 100% !important;
      }
      .widget-header, .tabs-container, .search-section, .print-btn-container, .header-print-btn {
        display: none !important;
      }
      .result-card {
        display: block !important;
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .requirement-block {
        background: #ffffff !important;
        border: 1px solid #e2ece8 !important;
        border-left: 4px solid #2b886d !important;
        page-break-inside: avoid !important;
        margin-bottom: 12px !important;
      }
      .block-value a {
        text-decoration: none !important;
        color: #000000 !important;
      }
      .source-link {
        display: none !important;
      }
    }
  </style>
</head>

oup": "Средний медперсонал с СПО", "name": "Старшая медицинская сестра / старший медицинский брат с СПО", "details": [{"label": "Квалификационные требования", "value": "По приказу Минздрава от 10.02.2016 № 83н<br><br>Вариант 1: среднее профобразование по одной из специальностей: \"Лечебное дело\", \"Акушерское дело\", \"Сестринское дело\" + профпереподготовка по одной из специальностей: \"Анестезиология и реаниматология\", \"Лечебная физкультура\", \"Реабилитационное сестринское дело\", \"Сестринское дело в педиатрии\", \"Сестринское дело в косметологии\", \"Физиотерапия\", \"Функциональная диагностика\"<br><br>Вариант 2: среднее профобразование по одной из специальностей: \"Лечебное дело\", \"Акушерское дело\", \"Сестринское дело\", \"Медицинский массаж\" (для лиц с ограниченными возможностями здоровья по зрению) + профпереподготовка по специальности \"Медицинский массаж\" при наличии среднего профессионального образования по одной из специальностей: \"Лечебное дело\", \"Акушерское дело\", \"Сестринское дело\"<br><br>Вариант 3: среднее профобразование по одной из специальностей: \"Лечебное дело\", \"Акушерское дело\", \"Сестринское дело\" + профпереподготовка по специальности \"Сестринское дело\" при наличии среднего профобразования по одной из специальностей: \"Лечебное дело\", \"Акушерское дело\"<br><br>Для всех вариантов: повышение квалификации не реже одного раза в 5 лет в течение всей трудовой деятельности"}, {"label": "Справка об отсутствии судимости", "value": "Нужна, если:<br>– работник участвует в оказании медпомощи несовершеннолетним;<br>– специалист будет ответственным за материальные ценности;<br>– специалист будет работать с НС и ПВ.<br><a href=\"https://glms.action360.ru/#/document/16/213700/dfase7urgk\" target=\"_blank\">Подробнее>></a>"}, {"label": "Дополнительно для допуска к НС и ПВ", "value": "Нужны:<br>– запрос в МВД;<br>– психиатрические освидетельствования при приеме на работу и затем один раз в пять лет;<br>– медосвидетельствование в наркодиспансере до начала рабочей деятельности;<br>– ознакомление с нормативной базой – при заключении трудового договора или допсоглашения к нему; обучение – по плану-графику обучения сотрудников.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfaspqtnkz\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Медосмотры и медосвидетельствования", "value": "Обязательны медосмотры и обследования по перечню, при поступлении на работу и далее раз в год.<br>Дополнительно в рамках медосмотров нужно медосвидетельствование на ВИЧ, если работник задействован в подразделениях, медорганизациях и на работах из перечня.<br>Дополнительно психиатрические освидетельствования нужны при приеме на работу и затем один раз в пять лет, если работник занят на работах из перечня.<br><br><a href=\"https://1glms.ru/#/document/16/213700/dfaskchp19\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Вакцинация", "value": "См. перечень прививок, необходимых работнику при поступлении на работу и далее по календарю.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasdhfiiz\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Обязательные инструктажи", "value": "Обязательно всем сотрудникам:<br>– по охране труда инструктаж – в первый рабочий день, обучение – в течение 60 дней;<br>– по пожарной безопасности вводный и первичный инструктажи – до начала трудовой деятельности и далее не реже 1 раза в год (не реже 1 раза в 6 месяцев, если в медорганизации временно пребывает 50 и более человек одновременно);<br>– инструктажи по ГО при приеме на работу; по ЧС – при приеме на работу и затем ежегодно.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasxcnilx\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Дополнительное обучение для отдельных видов работ", "value": "Для допуска к отдельным видам работ потребуются:<br>– по безопасному обращению с медотходами и работе с соответствующим оборудованием – предварительный и периодические не реже 1 раза в год инструктажи;<br>– для работы с электрооборудованием – специальное обучение по электробезопасности в период адаптации на должности.<br>Сотрудникам ЦСО, работающим с сосудами под давлением, также нужно проходить аттестацию.<br><br><a href=\"https://glms.action360.ru/#/document/16/142029\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}]}, {"code": "", "group": "Средний медперсонал с СПО", "name": "Старшая акушерка/ старший акушер  с СПО", "details": [{"label": "Квалификационные требования", "value": "По приказу Минздрава от 10.02.2016 № 83н: среднее профобразование по одной из специальностей: \"Лечебное дело\", \"Акушерское дело\" + профпереподготовка по специальности \"Акушерское дело\" при наличии среднего профессионального образования по специальности \"Лечебное дело\"<br><br>Повышение квалификации не реже одного раза в 5 лет в течение всей трудовой деятельности"}, {"label": "Справка об отсутствии судимости", "value": "Нужна.<br><a href=\"https://glms.action360.ru/#/document/16/213700/dfase7urgk\" target=\"_blank\">Подробнее>></a>"}, {"label": "Дополнительно для допуска к НС и ПВ", "value": "Нужны:<br>– запрос в МВД;<br>– психиатрические освидетельствования при приеме на работу и затем один раз в пять лет;<br>– медосвидетельствование в наркодиспансере до начала рабочей деятельности;<br>– ознакомление с нормативной базой – при заключении трудового договора или допсоглашения к нему; обучение – по плану-графику обучения сотрудников.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfaspqtnkz\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Медосмотры и медосвидетельствования", "value": "Обязательны медосмотры и обследования по перечню, при поступлении на работу и далее раз в год.<br>Дополнительно в рамках медосмотров нужно медосвидетельствование на ВИЧ. <a href еме на работу; по ЧС – при приеме на работу и затем ежегодно.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasxcnilx\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Дополнительное обучение для отдельных видов работ", "value": "Для допуска к отдельным видам работ потребуются:<br>– по безопасному обращению с медотходами и работе с соответствующим оборудованием – предварительный и периодические не реже 1 раза в год инструктажи;<br>– для работы с электрооборудованием – специальное обучение по электробезопасности в период адаптации на должности.<br><br><a href=\"https://glms.action360.ru/#/document/16/142029\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}]}, {"code": "12.3", "group": "Младший медперсонал", "name": "Санитарка / санитар", "details": [{"label": "Квалификационные требования (кратко)", "value": "По приказу Минздравсоцразвития от 23.07.2010 № 541н: среднее (полное) общее образование без предъявления требований к стажу работы<br><br>По профстандарту из приказа Минтруда от 12.01.2016 № 2н: среднее общее образование + профессиональное обучение по должности \"Санитар\""}, {"label": "Справка об отсутствии судимости", "value": "Нужна, если работник участвует в оказании медпомощи несовершеннолетним и в ряде других ситуаций.<br><a href=\"https://glms.action360.ru/#/document/16/213700/dfase7urgk\" target=\"_blank\">Подробнее>></a>"}, {"label": "Дополнительно для допуска к НС и ПВ", "value": "–"}, {"label": "Медосмотры и медосвидетельствования", "value": "Обязательны медосмотры и обследования по перечню, при поступлении на работу и далее раз в год.<br>Дополнительно в рамках медосмотров нужно медосвидетельствование на ВИЧ, если работник задействован в подразделениях, медорганизациях и на работах из перечня.<br>Дополнительно психиатрические освидетельствования нужны при приеме на работу и затем один раз в пять лет, если работник занят на работах из перечня.<br><br><a href=\"https://1glms.ru/#/document/16/213700/dfaskchp19\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Вакцинация", "value": "См. перечень прививок, необходимых работнику при поступлении на работу и далее по календарю.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasdhfiiz\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Обязательные инструктажи", "value": "Обязательно всем сотрудникам:<br>– по охране труда инструктаж – в первый рабочий день, обучение – в течение 60 дней;<br>– по пожарной безопасности вводный и первичный инструктажи – до начала трудовой деятельности и далее не реже 1 раза в год (не реже 1 раза в 6 месяцев, если в медорганизации временно пребывает 50 и более человек одновременно);<br>– инструктажи по ГО при приеме на работу; по ЧС – при приеме на работу и затем ежегодно.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasxcnilx\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Дополнительное обучение для отдельных видов работ", "value": "Для допуска к отдельным видам работ потребуются:<br>– по безопасному обращению с медотходами и работе с соответствующим оборудованием – предварительный и периодические не реже 1 раза в год инструктажи;<br>– для работы с электрооборудованием – специальное обучение по электробезопасности в период адаптации на должности.<br>Сотрудникам ЦСО, работающим с сосудами под давлением, также нужно проходить аттестацию.<br><br><a href=\"https://glms.action360.ru/#/document/16/142029\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}]}, {"code": "12.4", "group": "Младший медперсонал", "name": "Сестра-хозяйка", "details": [{"label": "Квалификационные требования (кратко)", "value": "По приказу Минздравсоцразвития от 23.07.2010 № 541н: среднее (полное) общее образование и дополнительная подготовка по направлению профессиональной деятельности без предъявления требований к стажу работы"}, {"label": "Справка об отсутствии судимости", "value": "Нужна, если работник участвует в оказании медпомощи несовершеннолетним и в ряде других ситуаций.<br><a href=\"https://glms.action360.ru/#/document/16/213700/dfase7urgk\" target=\"_blank\">Подробнее>></a>"}, {"label": "Дополнительно для допуска к НС и ПВ", "value": "–"}, {"label": "Медосмотры и медосвидетельствования", "value": "Обязательны медосмотры и обследования по перечню, при поступлении на работу и далее раз в год.<br>Дополнительно в рамках медосмотров нужно медосвидетельствование на ВИЧ, если работник задействован в подразделениях, медорганизациях и на работах из перечня.<br>Дополнительно психиатрические освидетельствования нужны при приеме на работу и затем один раз в пять лет, если работник занят на работах из перечня.<br><br><a href=\"https://1glms.ru/#/document/16/213700/dfaskchp19\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Вакцинация", "value": "См. перечень прививок, необходимых работнику при поступлении на работу и далее по календарю.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasdhfiiz\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Обязательные инструктажи", "value": "Обязательно всем сотрудникам:<br>– по охране труда инструктаж – в первый рабочий день, обучение – в течение 60 дней;<br>– по пожарной безопасности вводный и первичный инструктажи – до начала трудовой деятельности и далее не реже 1 раза в год (не реже 1 раза в 6 месяцев, если в медорганизации временно пребывает 50 и более человек одновременно);<br>– инструктажи по ГО при приеме на работу; по ЧС – при приеме на работу и затем ежегодно.<br><br><a href=\"https://glms.action360.ru/#/document/16/213700/dfasxcnilx\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}, {"label": "Дополнительное обучение для отдельных видов работ", "value": "Для допуска к отдельным видам работ потребуются:<br>– по безопасному обращению с медотходами и работе с соответствующим оборудованием – предварительный и периодические не реже 1 раза в год инструктажи;<br>– для работы с электрооборудованием – специальное обучение по электробезопасности в период адаптации на должности.<br><br><a href=\"https://glms.action360.ru/#/document/16/142029\" target=\"_blank\" class=\"source-link\">Посмотреть в системе а360 ↗</a>"}]}]};

    document.addEventListener('DOMContentLoaded', () => {
      const positionSearch = document.getElementById('position-search');
      const positionDropdown = document.getElementById('position-dropdown');
      const searchClear = document.getElementById('search-clear');
      const arrowIcon = document.getElementById('arrow-icon');
      const tabsBar = document.getElementById('tabs-bar');
      const searchLabel = document.getElementById('search-label');
      
      const resultCard = document.getElementById('result-card');
      const resultTitle = document.getElementById('result-title');
      const resultCode = document.getElementById('result-code');
      const reqContainer = document.getElementById('requirements-container');
      
      const printButton = document.getElementById('print-button');
      const headerPrintButton = document.getElementById('header-print-button');

      let currentTab = "Руководители";
      let focusedIndex = -1;
      let selectedItem = null;

      // Tab short names for display
      const tabLabels = {
        "Руководители": "Руководители",
        "Заведующие": "Заведующие",
        "Средний медперсонал с ВСО": "Ср. медперсонал с ВСО",
        "Средний медперсонал с СПО": "Ср. медперсонал с СПО",
        "Младший медперсонал": "Младший медперсонал"
      };

      function init() {
        // Setup tabs listeners
        const tabBtns = tabsBar.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          btn.addEventListener('click', () => {
            const tabName = btn.getAttribute('data-tab');
            switchTab(tabName);
          });
        });

        positionSearch.addEventListener('input', handleSearchInput);
        positionSearch.addEventListener('click', handleSearchClick);
        searchClear.addEventListener('click', handleSearchClear);
        positionSearch.addEventListener('keydown', handleSearchKeydown);
        printButton.addEventListener('click', () => window.print());
        headerPrintButton.addEventListener('click', () => window.print());

        document.addEventListener('click', (e) => {
          if (!positionSearch.contains(e.target) && !positionDropdown.contains(e.target)) {
            closeDropdown();
          }
        });
      }

      function switchTab(tabName) {
        if (currentTab === tabName) return;
        
        currentTab = tabName;
        
        // Update active tab class
        const tabBtns = tabsBar.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => {
          if (btn.getAttribute('data-tab') === tabName) {
            btn.classList.add('active');
          } else {
            btn.classList.remove('active');
          }
        });

        // Update search label
        searchLabel.textContent = `Выберите должность (${tabLabels[tabName] || tabName})`;
        
        // Reset search input and result card
        positionSearch.value = '';
        searchClear.style.display = 'none';
        closeDropdown();
        resultCard.classList.remove('visible');
        selectedItem = null;
      }

      function getFilteredPositions(query = '') {
        const positions = matrixData[currentTab] || [];
        // Sort alphabetically
        const sorted = [...positions].sort((a, b) => a.name.localeCompare(b.name));
        
        const q = query.trim().toLowerCase();
        if (!q) return sorted;
        return sorted.filter(item => item.name.toLowerCase().includes(q));
      }

      function renderDropdown(query = '') {
        positionDropdown.innerHTML = '';
        focusedIndex = -1;
        const q = query.trim().toLowerCase();
        
        const filtered = getFilteredPositions(query);

        if (filtered.length > 0) {
          filtered.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'dropdown-item';
            
            // Highlight matching text if query is present
            if (q) {
              const regex = new RegExp(`(${q.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')})`, 'gi');
              const highlightedText = item.name.replace(regex, '<strong>$1</strong>');
              div.innerHTML = highlightedText;
            } else {
              div.textContent = item.name;
            }
            
            div.dataset.index = index;
            
            div.addEventListener('click', (e) => {
              e.stopPropagation();
              selectItem(item);
            });
            positionDropdown.appendChild(div);
          });
          positionDropdown.classList.add('visible');
          arrowIcon.style.transform = 'translateY(-50%) rotate(180deg)';
        } else {
          closeDropdown();
        }
      }

      function getIconSvg(label) {
        const l = label.toLowerCase();
        if (l.includes('квалификационные')) {
          return `<svg viewBox="0 0 24 24"><path d="M12 11.55C11.2 10.4 9.7 9.8 8 9.8c-1.9 0-3.7.8-5 2.1V5c1.3-1.3 3-2.1 5-2.1 1.7 0 3.2.6 4 1.8 1.1-1.2 2.6-1.8 4.3-1.8 2 0 3.7.8 5 2.1v6.9c-1.3-1.3-3.1-2.1-5-2.1-1.7 0-3.2.6-4.3 1.75zM12 21.5c-.8-1.2-2.3-1.8-4-1.8-1.9 0-3.7.8-5 2.1v-6.9c1.3-1.3 3.1-2.1 5-2.1 1.7 0 3.2.6 4 1.8 1.1-1.2 2.6-1.8 4.3-1.8 2 0 3.7.8 5 2.1v6.9c-1.3-1.3-3.1-2.1-5-2.1-1.7 0-3.2.6-4.3 1.8z"/></svg>`;
        } else if (l.includes('судимости')) {
          return `<svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 15l-4-4 1.41-1.41L10 13.17l6.59-6.59L18 8l-8 8z"/></svg>`;
        } else if (l.includes('нс и пв')) {
          return `<svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>`;
        } else if (l.includes('медосмотры') || l.includes('освидетельствования')) {
          return `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
        } else if (l.includes('вакцинация') || l.includes('привив')) {
          return `<svg viewBox="0 0 24 24"><path d="M19 10.5V6.75l1.25-1.25-1.06-1.06L17.94 5.69l-1.06-1.06c-.39-.39-1.02-.39-1.41 0L14.41 5.7c-.39.39-.39 1.02 0 1.41l1.06 1.06-1.59 1.59c-1.38-.59-3.08-.25-4.16.83L8.66 11.66c-.39.39-.39 1.02 0 1.41l3.27 3.27c.39.39 1.02.39 1.41 0l1.06-1.06c1.08-1.08 1.42-2.78.83-4.16l1.59-1.59 1.06 1.06c.39.39 1.02.39 1.41 0l1.06-1.06-1.35-1.35zM11.66 14.25l-2.21-2.21.71-.71 2.21 2.21-.71.71zm-4.72 2.7l-3.23 3.23c-.39.39-.39 1.02 0 1.41s1.02.39 1.41 0l3.23-3.23-.71-.71-1.11.7-1.31-1.31.71-1.1z"/></svg>`;
        } else if (l.includes('обучение')) {
          return `<svg viewBox="0 0 24 24"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5.49 12.07l-3.23-1.76L12 5.82l9.74 4.49-3.23 1.76L12 8.5l-6.51 3.57zM12 18.18l-8-4.36v2.54l8 4.36 8-4.36v-2.54l-8 4.36z"/></svg>`;
        } else {
          return `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 12 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>`;
        }
      }

      function selectItem(item) {
        selectedItem = item;
        positionSearch.value = item.name;
        closeDropdown();
        searchClear.style.display = 'inline';
        
        // Populate static header of card
        resultTitle.textContent = item.name;
        resultCode.textContent = item.code ? "п.п. " + item.code : "—";
        
        // Render dynamic requirements block
        reqContainer.innerHTML = '';
        item.details.forEach(detail => {
          const block = document.createElement('div');
          block.className = 'requirement-block';
          
          const header = document.createElement('div');
          header.className = 'block-header';
          
          const iconSpan = document.createElement('span');
          iconSpan.className = 'block-icon';
          iconSpan.innerHTML = getIconSvg(detail.label);
          
          const labelSpan = document.createElement('span');
          labelSpan.className = 'block-label';
          labelSpan.textContent = detail.label;
          
          header.appendChild(iconSpan);
          header.appendChild(labelSpan);
          
          const valueDiv = document.createElement('div');
          valueDiv.className = 'block-value';
          valueDiv.innerHTML = detail.value;
          
          block.appendChild(header);
          block.appendChild(valueDiv);
          reqContainer.appendChild(block);
        });
        
        // Show card
        resultCard.classList.add('visible');
      }

      function handleSearchInput() {
        const val = positionSearch.value;
        searchClear.style.display = val ? 'inline' : 'none';
        renderDropdown(val);
        if (!val) {
          resultCard.classList.remove('visible');
          selectedItem = null;
        }
      }

      function handleSearchClick(e) {
        e.stopPropagation();
        renderDropdown(positionSearch.value);
      }

      function handleSearchClear(e) {
        e.stopPropagation();
        positionSearch.value = '';
        searchClear.style.display = 'none';
        closeDropdown();
        resultCard.classList.remove('visible');
        selectedItem = null;
        positionSearch.focus();
      }

      function closeDropdown() {
        positionDropdown.classList.remove('visible');
        arrowIcon.style.transform = 'translateY(-50%) rotate(0deg)';
      }

      function handleSearchKeydown(e) {
        const items = positionDropdown.querySelectorAll('.dropdown-item');
        if (!positionDropdown.classList.contains('visible') || items.length === 0) {
          if (e.key === 'ArrowDown') {
            renderDropdown(positionSearch.value);
          }
          return;
        }

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          focusedIndex = (focusedIndex + 1) % items.length;
          updateFocusedItem(items);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          focusedIndex = (focusedIndex - 1 + items.length) % items.length;
          updateFocusedItem(items);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (focusedIndex >= 0 && focusedIndex < items.length) {
            items[focusedIndex].click();
          }
        } else if (e.key === 'Escape') {
          closeDropdown();
        }
      }

      function updateFocusedItem(items) {
        items.forEach((item, index) => {
          if (index === focusedIndex) {
            item.classList.add('selected');
            item.scrollIntoView({ block: 'nearest' });
          } else {
            item.classList.remove('selected');
          }
        });
      }

      init();
    });
  </script>
</body>
</html>
